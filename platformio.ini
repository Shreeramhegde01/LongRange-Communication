; ==============================================================================
;  Long-Range Secure Messaging System using ESP32 and LoRa
;  PlatformIO build configuration
; ------------------------------------------------------------------------------
;  Default target: Heltec Wireless Stick Lite V3 (ESP32-S3 + SX1262, no display)
;  Alternates:     Heltec WiFi LoRa 32 V3 (same chipset, adds a 128x64 OLED)
;                  Generic ESP32 DevKit + SX1276 (RA-01H) module
;
;  Build/upload:  pio run -t upload
;  Serial:        pio device monitor
; ==============================================================================

[platformio]
src_dir = src/LoRaMesh
default_envs = heltec_wireless_stick_lite_v3

; ------------------------------------------------------------------------------
;  Settings shared by every board target
; ------------------------------------------------------------------------------
[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The BLE stack plus mbedTLS pushes the app past the 1.3 MB default partition.
board_build.partitions = huge_app.csv

lib_deps =
    jgromes/RadioLib @ ^7.1.2

build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

; ------------------------------------------------------------------------------
;  Heltec Wireless Stick Lite V3 - ESP32-S3 + SX1262, no display.
;  Buy the 863-870 MHz variant for the Indian 865-867 MHz ISM band.
; ------------------------------------------------------------------------------
;  PlatformIO ships no board file for the Lite V3, so we borrow the WiFi LoRa
;  32 V3 one - identical ESP32-S3FN8, 8 MB flash, no PSRAM. Only the MCU and
;  flash geometry come from the board file; every pin comes from config.h.
[env:heltec_wireless_stick_lite_v3]
board = heltec_wifi_lora_32_V3

; ------------------------------------------------------------------------------
;  Heltec WiFi LoRa 32 V3 - same chipset plus an onboard 128x64 OLED.
;  Only this env pulls in the display driver.
; ------------------------------------------------------------------------------
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3_OLED=1
lib_deps =
    ${env.lib_deps}
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1

; ------------------------------------------------------------------------------
;  Generic ESP32 DevKit + SX1276 (RA-01H) - no display.
;  Wire the radio per the SX1276 pin block in config.h before using this env.
; ------------------------------------------------------------------------------
[env:esp32dev_sx1276]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_SX1276=1
