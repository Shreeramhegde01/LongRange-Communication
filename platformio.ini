; ==============================================================================
;  Long-Range Secure Messaging System using ESP32 and LoRa
;  PlatformIO build configuration
; ------------------------------------------------------------------------------
;  Default target: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + 128x64 OLED)
;  Alternates:     the same board with the display left undriven
;                  Generic ESP32 DevKit + SX1276 (RA-01H) module
;
;  Build/upload:  pio run -t upload
;  Serial:        pio device monitor
; ==============================================================================

[platformio]
src_dir = src/LoRaMesh
default_envs = heltec_wifi_lora_32_V3

; ------------------------------------------------------------------------------
;  Settings shared by every board target
; ------------------------------------------------------------------------------
[env]
platform = espressif32 @ ^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; The BLE stack plus mbedTLS pushes the app past the 1.3 MB default partition.
board_build.partitions = huge_app.csv

lib_deps =
    jgromes/RadioLib @ ^7.1.2

build_flags =
    -std=gnu++17
    -Wall
build_unflags =
    -std=gnu++11

; ------------------------------------------------------------------------------
;  Heltec WiFi LoRa 32 V3 - ESP32-S3FN8 + SX1262, 0.96" 128x64 OLED, CP2102
;  USB-serial bridge, SH1.25-2 battery connector, IPEX (u.FL) for the LoRa
;  antenna. This is the board we bought: the 863-928 MHz variant, which
;  covers the Indian 865-867 MHz ISM band.
;
;  The display-less Wireless Stick Lite V3 was the original choice, but it is
;  not sold in India in this band - only a 470 MHz variant is - so this is
;  what we could actually get. Having a display, we use it for local
;  diagnostics; the phone remains the messaging interface.
; ------------------------------------------------------------------------------
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
build_flags =
    ${env.build_flags}
    -D BOARD_HELTEC_V3_OLED=1
lib_deps =
    ${env.lib_deps}
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.6.1

; ------------------------------------------------------------------------------
;  The same board with the display left undriven. Build this to measure what
;  the OLED actually costs in current (NFR6), or to keep a node running if a
;  panel fails. The LoRa and battery pin map is shared by the whole V3 family,
;  so this target also fits a Wireless Stick V3 or Stick Lite V3.
; ------------------------------------------------------------------------------
[env:heltec_v3_nodisplay]
board = heltec_wifi_lora_32_V3

; ------------------------------------------------------------------------------
;  Generic ESP32 DevKit + SX1276 (RA-01H) - no display.
;  Wire the radio per the SX1276 pin block in config.h before using this env.
; ------------------------------------------------------------------------------
[env:esp32dev_sx1276]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D BOARD_ESP32_SX1276=1
